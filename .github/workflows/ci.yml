name: ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: chatdemo    # the backend package lives in this subdirectory

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy || true   # non-blocking for now — type coverage isn't complete yet
      - name: Test
        run: uv run pytest -q

  build-image:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chatdemo-platform:${{ github.sha }} ./chatdemo
      # - name: Publish  # wire up registry credentials, then uncomment
      #   run: docker push ...
