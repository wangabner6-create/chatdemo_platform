name: Observability evaluation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: observability-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    name: Evaluation quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLLAMA_VERSION: "0.34.2"
      EVAL_CHAT_MODEL: qwen3:4b-instruct
      EVAL_EMBED_MODEL: qwen3-embedding:0.6b
    defaults:
      run:
        working-directory: chatdemo

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: chatdemo/uv.lock

      - name: Install project
        run: uv sync --frozen --extra dev --extra observability

      - name: Run deterministic tests
        run: uv run pytest

      - name: Check evaluation code
        run: uv run ruff check src/chatdemo/evaluation.py tests/test_evaluation.py

      - name: Restore Ollama model cache
        id: ollama-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.ollama/models
          key: ${{ runner.os }}-ollama-0.34.2-qwen3-4b-instruct-qwen3-embedding-0.6b-v1

      - name: Start pinned Ollama service
        shell: bash
        run: |
          mkdir -p "$HOME/.ollama/models"
          docker run --detach \
            --name chatdemo-ollama \
            --publish 11434:11434 \
            --volume "$HOME/.ollama:/root/.ollama" \
            "ollama/ollama:${OLLAMA_VERSION}"

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:11434/api/version >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs chatdemo-ollama
          exit 1

      - name: Pull real evaluation models
        id: models
        run: |
          docker exec chatdemo-ollama ollama pull "$EVAL_CHAT_MODEL"
          docker exec chatdemo-ollama ollama pull "$EVAL_EMBED_MODEL"
          docker exec chatdemo-ollama ollama list

      - name: Rebuild the RAG index for the evaluation provider
        env:
          CHATDEMO_BASE_URL: http://127.0.0.1:11434/v1
          CHATDEMO_API_KEY: ollama
          CHATDEMO_EMBED_MODEL: ${{ env.EVAL_EMBED_MODEL }}
          CHATDEMO_RERANK_MODEL: disabled
        run: uv run python scripts/ingest_docs.py

      - name: Run quality regression gate
        env:
          CHATDEMO_BASE_URL: http://127.0.0.1:11434/v1
          CHATDEMO_API_KEY: ollama
          CHATDEMO_MODEL: ${{ env.EVAL_CHAT_MODEL }}
          CHATDEMO_ROUTER_MODEL: ${{ env.EVAL_CHAT_MODEL }}
          CHATDEMO_SKILL_MODEL: ${{ env.EVAL_CHAT_MODEL }}
          CHATDEMO_RELATED_MODEL: ${{ env.EVAL_CHAT_MODEL }}
          CHATDEMO_API_STYLE: completion
          CHATDEMO_ENABLE_THINKING: "false"
          CHATDEMO_EMBED_MODEL: ${{ env.EVAL_EMBED_MODEL }}
          CHATDEMO_RERANK_MODEL: disabled
          CHATDEMO_ENABLED: docs-assistant,general-fallback
          CHATDEMO_REDIS_URL: ""
          CHATDEMO_SAFETY: "on"
          CHATDEMO_MAX_TOKENS: "768"
          CHATDEMO_TRACING: ${{ secrets.CHATDEMO_EVAL_PHOENIX_ENDPOINT != '' && 'on' || 'off' }}
          CHATDEMO_PHOENIX_ENDPOINT: ${{ secrets.CHATDEMO_EVAL_PHOENIX_ENDPOINT }}
          CHATDEMO_PHOENIX_URL: ${{ secrets.CHATDEMO_EVAL_PHOENIX_URL }}
          CHATDEMO_TRACE_PROJECT: chatdemo-ci
          CHATDEMO_EVAL_PUBLISH_PHOENIX: ${{ secrets.CHATDEMO_EVAL_PHOENIX_URL != '' && 'true' || 'false' }}
          PHOENIX_API_KEY: ${{ secrets.CHATDEMO_EVAL_PHOENIX_API_KEY }}
        # The hosted CPU runner is intentionally given its own observed latency
        # ceiling; quality metrics still use the reviewed cross-machine baseline.
        run: >-
          uv run chatdemo-eval
          --require-baseline
          --latency-p95-ceiling-ms 360000
          --version "${GITHUB_SHA::12}"

      - name: Add report to workflow summary
        if: always()
        shell: bash
        run: |
          if [[ -f evals/results/report.md ]]; then
            cat evals/results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chatdemo-observability-eval-${{ github.run_id }}
          path: |
            chatdemo/evals/results/report.json
            chatdemo/evals/results/report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Publish or update PR report
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const fs = require("fs");
            const reportPath = "chatdemo/evals/results/report.md";
            if (!fs.existsSync(reportPath)) return;
            const marker = "<!-- chatdemo-observability-eval -->";
            const body = `${marker}\n${fs.readFileSync(reportPath, "utf8")}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Stop evaluation service
        if: always()
        shell: bash
        run: |
          docker rm --force chatdemo-ollama 2>/dev/null || true
          sudo chown --recursive "$(id -u):$(id -g)" "$HOME/.ollama" 2>/dev/null || true

      - name: Save Ollama model cache
        if: >-
          always() &&
          steps.models.outcome == 'success' &&
          steps.ollama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.ollama/models
          key: ${{ steps.ollama-cache.outputs.cache-primary-key }}
