[project]
name = "chatdemo-platform"
version = "0.1.0"
description = "Generic RAG chatbot platform on an agent orchestration toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "redis>=5.0",
    "openai>=1.50",
    "tzdata>=2024.1",
    "nvidia-nat==1.8.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
observability = [
    "arize-phoenix>=15.5",
    "arize-phoenix-client>=3.5",
    "nvidia-nat-phoenix==1.8.0",
]

[project.scripts]
chatdemo = "chatdemo.api:main"
chatdemo-eval = "chatdemo.evaluation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatdemo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = [".venv"]

[tool.mypy]
python_version = "3.11"
packages = ["chatdemo"]
ignore_missing_imports = true
